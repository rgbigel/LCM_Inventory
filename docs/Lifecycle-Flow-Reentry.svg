<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" role="img" aria-labelledby="title desc">
  <title id="title">LCM lifecycle change and re-entry code traversal</title>
  <desc id="desc">Held, reopened, rejected, and reinstated lifecycle branches. Gray blocks collapse unchanged implementation work.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8z" fill="#334155"/></marker><style>.h{fill:#0f172a}.t{font:700 26px Arial;fill:#fff}.n{fill:#eff6ff;stroke:#2563eb;stroke-width:3;rx:10}.g{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5;rx:10}.r{fill:#fef2f2;stroke:#dc2626;stroke-width:3;rx:10}.x{font:700 16px Arial;fill:#0f172a}.s{font:13px Arial;fill:#334155}.l{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1300" height="700" fill="#f8fafc"/><rect class="h" width="1300" height="82"/><text class="t" x="32" y="49">CHANGE / RE-ENTRY LIFECYCLE - resume earlier work without erasing evidence</text>
  <rect class="n" x="50" y="150" width="210" height="105"/><text class="x" x="75" y="184">Active state</text><text class="s" x="75" y="210">suggested / in_progress</text><text class="s" x="75" y="232">verified / in_review</text>
  <rect class="n" x="340" y="150" width="210" height="105"/><text class="x" x="365" y="184">hold action</text><text class="s" x="365" y="210">Invoke-ProposalAction</text><text class="s" x="365" y="232">Move lifecycle -&gt; held</text><path class="l" d="M260 202 L340 202"/>
  <rect class="g" x="630" y="150" width="210" height="105"/><text class="x" x="655" y="184">held state</text><text class="s" x="655" y="210">resume_state retained</text><text class="s" x="655" y="232">history remains append-only</text><path class="l" d="M550 202 L630 202"/>
  <rect class="n" x="920" y="150" width="250" height="105"/><text class="x" x="945" y="184">continue / reopen</text><text class="s" x="945" y="210">ProposalManager resolves resume</text><text class="s" x="945" y="232">returns to permitted earlier state</text><path class="l" d="M840 202 L920 202"/>
  <rect class="r" x="50" y="425" width="210" height="110"/><text class="x" x="75" y="460">Review rejection</text><text class="s" x="75" y="486">in_review -&gt; rejected</text><text class="s" x="75" y="508">Gate 2 disposition recorded</text>
  <rect class="r" x="340" y="425" width="210" height="110"/><text class="x" x="365" y="460">Terminal correction route</text><text class="s" x="365" y="486">supersede or linked BUG</text><text class="s" x="365" y="508">new CRP owns new work</text><path class="l" d="M260 480 L340 480"/>
  <rect class="n" x="630" y="425" width="210" height="110"/><text class="x" x="655" y="460">Reinstatement</text><text class="s" x="655" y="486">completed/pushed evidence</text><text class="s" x="655" y="508">concrete changes required</text>
  <rect class="g" x="920" y="425" width="250" height="110"/><text class="x" x="945" y="460">Re-enter normal path</text><text class="s" x="945" y="486">new revision/history event</text><text class="s" x="945" y="508">verification and BCR repeat</text><path class="l" d="M840 480 L920 480"/>
  <text class="s" x="50" y="630">No branch deletes prior review, receipt, or state history. Re-entry is an explicit action with an exact target.</text>
</svg>
