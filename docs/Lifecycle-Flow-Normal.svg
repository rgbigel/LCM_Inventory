<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="680" viewBox="0 0 1300 680" role="img" aria-labelledby="title desc">
  <title id="title">Normal LCM lifecycle code traversal</title>
  <desc id="desc">Suggested to commit/push lifecycle flow. Gray blocks collapse unchanged internal code; green blocks are active code boundaries.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8z" fill="#334155"/></marker><style>.h{fill:#0f172a}.t{font:700 26px Arial;fill:#fff}.n{fill:#ecfdf5;stroke:#059669;stroke-width:3;rx:10}.g{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5;rx:10}.x{font:700 16px Arial;fill:#0f172a}.s{font:13px Arial;fill:#334155}.l{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1300" height="680" fill="#f8fafc"/><rect class="h" width="1300" height="82"/><text class="t" x="32" y="49">NORMAL LIFECYCLE - suggested through commit/push</text>
  <rect class="n" x="35" y="145" width="185" height="104"/><text class="x" x="60" y="180">ShowCM / operator</text><text class="s" x="60" y="206">explicit ITEM + action</text><text class="s" x="60" y="228">CRP identity visible</text>
  <rect class="n" x="285" y="145" width="200" height="104"/><text class="x" x="310" y="180">Invoke-ProposalAction</text><text class="s" x="310" y="206">resolve target/cohort</text><text class="s" x="310" y="228">dispatch action</text><path class="l" d="M220 197 L285 197"/>
  <rect class="g" x="550" y="145" width="190" height="104"/><text class="x" x="575" y="180">Gate 1 / implementation</text><text class="s" x="575" y="206">suggested -&gt; in_progress</text><text class="s" x="575" y="228">work + focused tests</text><path class="l" d="M485 197 L550 197"/>
  <rect class="g" x="805" y="145" width="180" height="104"/><text class="x" x="830" y="180">Verify</text><text class="s" x="830" y="206">in_progress -&gt; verified</text><text class="s" x="830" y="228">evidence recorded</text><path class="l" d="M740 197 L805 197"/>
  <rect class="n" x="1050" y="135" width="210" height="124"/><text class="x" x="1075" y="169">BCR Gate 2</text><text class="s" x="1075" y="195">Invoke-MacriumBcrReview</text><text class="s" x="1075" y="217">Macrium baseline + _LCM</text><text class="s" x="1075" y="239">-&gt; in_review</text><path class="l" d="M985 197 L1050 197"/>
  <rect class="n" x="420" y="405" width="220" height="112"/><text class="x" x="445" y="440">Operator review decision</text><text class="s" x="445" y="466">exact CRP / cohort scope</text><text class="s" x="445" y="488">recorded disposition</text><path class="l" d="M1155 259 L1155 340 L530 340 L530 405"/>
  <rect class="g" x="705" y="405" width="215" height="112"/><text class="x" x="730" y="440">Submit-ReviewResult</text><text class="s" x="730" y="466">stage, authorization, receipt</text><text class="s" x="730" y="488">Git commit</text><path class="l" d="M640 461 L705 461"/>
  <rect class="g" x="985" y="405" width="230" height="112"/><text class="x" x="1010" y="440">ProposalManager</text><text class="s" x="1010" y="466">in_review -&gt; completed</text><text class="s" x="1010" y="488">then explicit push</text><path class="l" d="M920 461 L985 461"/>
  <text class="s" x="35" y="620">Invariant: Move-LcmProposalLifecycleState refuses completion without a BCR disposition or an explicit authorized bypass.</text>
</svg>
