<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">LCM emergency and non-default switch code traversal</title>
  <desc id="desc">Current code paths for DOIT and Immediately, with CRP-285 proposed operator authorization controls clearly marked.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8z" fill="#334155"/></marker><style>.h{fill:#0f172a}.t{font:700 26px Arial;fill:#fff}.c{fill:#fff7ed;stroke:#ea580c;stroke-width:3;rx:10}.p{fill:#fefce8;stroke:#ca8a04;stroke-width:3;stroke-dasharray:8 5;rx:10}.g{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5;rx:10}.x{font:700 16px Arial;fill:#0f172a}.s{font:13px Arial;fill:#334155}.o{font:700 13px Arial;fill:#c2410c}.y{font:700 13px Arial;fill:#a16207}.l{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1300" height="720" fill="#f8fafc"/><rect class="h" width="1300" height="82"/><text class="t" x="32" y="49">EMERGENCY / NON-DEFAULT SWITCHES - current code and CRP-285 policy target</text>
  <rect class="p" x="35" y="120" width="260" height="110"/><text class="y" x="60" y="150">CRP-285 PROPOSED CONTROL</text><text class="x" x="60" y="178">Exact operator expression</text><text class="s" x="60" y="202">DOIT, FIX, or IMMEDIATELY only</text><text class="s" x="60" y="222">AI inference prohibited</text>
  <rect class="c" x="365" y="120" width="245" height="110"/><text class="o" x="390" y="150">CURRENT: DOIT MODE</text><text class="x" x="390" y="178">Invoke-ProposalAction</text><text class="s" x="390" y="202">doit-mode + SwitchState</text><text class="s" x="390" y="222">store.always_proceed</text><path class="l" d="M295 175 L365 175"/>
  <rect class="g" x="680" y="120" width="245" height="110"/><text class="x" x="705" y="178">Continuation path</text><text class="s" x="705" y="202">verified + DOIT</text><text class="s" x="705" y="222">dispatches required BCR</text><path class="l" d="M610 175 L680 175"/>
  <rect class="g" x="995" y="120" width="245" height="110"/><text class="x" x="1020" y="178">Gate 2 remains required</text><text class="s" x="1020" y="202">BCR + disposition</text><text class="s" x="1020" y="222">before completion</text><path class="l" d="M925 175 L995 175"/>
  <rect class="p" x="35" y="410" width="260" height="120"/><text class="y" x="60" y="440">CRP-285 PROPOSED CONTROL</text><text class="x" x="60" y="468">FIX / IMMEDIATELY source</text><text class="s" x="60" y="492">exact CRP/BUG + reason</text><text class="s" x="60" y="514">visible scope and exit condition</text>
  <rect class="c" x="365" y="410" width="245" height="120"/><text class="o" x="390" y="440">CURRENT: -Immediately</text><text class="x" x="390" y="468">Enable-LcmImmediateBugRecovery</text><text class="s" x="390" y="492">requires target + Details</text><text class="s" x="390" y="514">sets quality deferral / BUG</text><path class="l" d="M295 470 L365 470"/>
  <rect class="g" x="680" y="410" width="245" height="120"/><text class="x" x="705" y="468">Bounded emergency work</text><text class="s" x="705" y="492">quality checks deferred</text><text class="s" x="705" y="514">recovery data recorded</text><path class="l" d="M610 470 L680 470"/>
  <rect class="g" x="995" y="410" width="245" height="120"/><text class="x" x="1020" y="468">BCR handoff ends deferral</text><text class="s" x="1020" y="492">Gate 2 never bypassed</text><text class="s" x="1020" y="514">normal completion evidence</text><path class="l" d="M925 470 L995 470"/>
  <text class="s" x="35" y="640">Orange = current code. Yellow dashed = CRP-285 policy not yet implemented. Neither path authorizes inferred switches or bypasses review.</text>
</svg>
